name: Protocol 5.9 failure capture

on:
  push:
    branches:
      - protocol-5.9-agent-portable-routing

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: protocol-5.9-agent-portable-routing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply candidate and capture tests
        shell: bash
        run: |
          set +e
          python tools/apply_protocol_5_9_routing.py
          python -m unittest discover -s tests -v > PROTOCOL_5_9_FAILURE.txt 2>&1
          rc=$?
          cat PROTOCOL_5_9_FAILURE.txt
          if [ "$rc" -eq 0 ]; then
            rm PROTOCOL_5_9_FAILURE.txt
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROTOCOL_5_9_FAILURE.txt
          git commit -m "Capture Protocol 5.9 regression failure"
          git push origin HEAD:protocol-5.9-agent-portable-routing
          exit "$rc"

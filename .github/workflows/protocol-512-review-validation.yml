name: Protocol 5.12 review rework validation

on:
  push:
    branches:
      - plan/protocol-5.12-convergent-development

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run focused Protocol 5.12 convergence tests
        id: focused
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_protocol_512_convergence -v > PROTOCOL_512_TEST_FAILURE.log 2>&1
          code=$?
          cat PROTOCOL_512_TEST_FAILURE.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Persist focused-test failure evidence
        if: steps.focused.outputs.exit_code != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROTOCOL_512_TEST_FAILURE.log
          if ! git diff --cached --quiet; then
            git commit -m "test: capture Protocol 5.12 focused failure"
            git push origin HEAD:plan/protocol-5.12-convergent-development
          fi
      - name: Stop after focused-test failure
        if: steps.focused.outputs.exit_code != '0'
        run: exit 1
      - name: Remove stale failure evidence
        if: steps.focused.outputs.exit_code == '0'
        run: rm -f PROTOCOL_512_TEST_FAILURE.log
      - name: Run full protocol regression suite
        if: steps.focused.outputs.exit_code == '0'
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages
        if: steps.focused.outputs.exit_code == '0'
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages
        if: steps.focused.outputs.exit_code == '0'
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        if: steps.focused.outputs.exit_code == '0'
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        if: steps.focused.outputs.exit_code == '0'
        run: git diff --check

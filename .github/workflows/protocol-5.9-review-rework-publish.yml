name: Protocol 5.9 review rework publish

on:
  push:
    branches:
      - protocol-5.9-agent-portable-routing-finalize
    paths:
      - .github/workflows/protocol-5.9-review-rework-publish.yml

permissions:
  contents: write

jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: protocol-5.9-agent-portable-routing-finalize
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded review fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator = Path("source/validate_packages.py")
          text = validator.read_text(encoding="utf-8")
          text = text.replace(
              "import re\nimport zipfile\nfrom pathlib import Path, PurePosixPath\n",
              "import re\nimport urllib.parse\nimport zipfile\nfrom pathlib import Path, PurePosixPath\n\nimport yaml\n",
          )
          old_constants = '''TOP_KEY_RE = re.compile(r"^([A-Za-z0-9_-]+):(?:\\s*(.*))?$")
          RESOURCE_MENTION_RE = re.compile(r"(?<![A-Za-z0-9_.-])((?:references|templates)/[A-Za-z0-9_.-]+\\.md)")
          DIRECT_LINK_RE = re.compile(r"\\[[^\\]]+\\]\\(((?:references|templates)/[A-Za-z0-9_.-]+\\.md)\\)")
          STANDARD_FRONTMATTER_KEYS = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}
          '''
          new_constants = '''MARKDOWN_LINK_RE = re.compile(r"\\[[^\\]]+\\]\\(([^)]+)\\)")
          SAFE_RESOURCE_LINK_RE = re.compile(r"^(?:references|templates)/[A-Za-z0-9_.-]+\\.md$")
          RESOURCE_NAMESPACE_RE = re.compile(r"(^|[\\\\/])(?:references|templates)(?:[\\\\/]|$)")
          URI_SCHEME_RE = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")
          STANDARD_FRONTMATTER_KEYS = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}
          '''
          if old_constants not in text:
              raise SystemExit("validator constants block changed unexpectedly")
          text = text.replace(old_constants, new_constants)

          start = text.index("def parse_frontmatter")
          end = text.index("def validate_agent_yaml")
          replacement = '''def parse_frontmatter(text: str) -> tuple[dict[str, object], str]:
              lines = text.splitlines()
              if not lines or lines[0].strip() != "---":
                  raise ValueError("SKILL.md must start with YAML frontmatter")
              try:
                  end = next(i for i in range(1, len(lines)) if lines[i].strip() == "---")
              except StopIteration as exc:
                  raise ValueError("SKILL.md frontmatter is not terminated") from exc
              source = "\\n".join(lines[1:end])
              try:
                  parsed = yaml.safe_load(source)
              except yaml.YAMLError as exc:
                  raise ValueError(f"SKILL.md frontmatter is invalid YAML: {exc}") from exc
              if not isinstance(parsed, dict):
                  raise ValueError("SKILL.md frontmatter must be a YAML mapping")
              if not all(isinstance(key, str) for key in parsed):
                  raise ValueError("SKILL.md frontmatter keys must be strings")
              return parsed, "\\n".join(lines[end + 1 :])


          def validate_frontmatter(text: str, skill_name: str) -> tuple[list[str], str]:
              errors: list[str] = []
              try:
                  frontmatter, body = parse_frontmatter(text)
              except ValueError as exc:
                  return [str(exc)], ""
              unknown = set(frontmatter) - STANDARD_FRONTMATTER_KEYS
              if unknown:
                  errors.append(f"unsupported non-portable frontmatter keys: {sorted(unknown)}")
              name = frontmatter.get("name")
              if not isinstance(name, str) or not name:
                  errors.append("frontmatter name must be a non-empty string")
              elif len(name) > 64 or not NAME_RE.fullmatch(name):
                  errors.append("frontmatter name violates portable kebab-case/64-character constraint")
              elif name != skill_name:
                  errors.append("frontmatter name mismatch")
              description = frontmatter.get("description")
              if not isinstance(description, str) or not description:
                  errors.append("frontmatter description must be a non-empty string")
              elif len(description) > 1024:
                  errors.append("frontmatter description exceeds 1024 characters")
              if "license" in frontmatter and not isinstance(frontmatter["license"], str):
                  errors.append("frontmatter license must be a string")
              if "compatibility" in frontmatter:
                  compatibility = frontmatter["compatibility"]
                  if not isinstance(compatibility, str) or not compatibility:
                      errors.append("frontmatter compatibility must be a non-empty string")
                  elif len(compatibility) > 500:
                      errors.append("frontmatter compatibility exceeds 500 characters")
              if "metadata" in frontmatter:
                  metadata = frontmatter["metadata"]
                  if not isinstance(metadata, dict):
                      errors.append("frontmatter metadata must be a mapping")
                  else:
                      for key, value in metadata.items():
                          if not isinstance(key, str) or not isinstance(value, str):
                              errors.append("frontmatter metadata keys and values must be strings")
                              break
              if "allowed-tools" in frontmatter:
                  allowed_tools = frontmatter["allowed-tools"]
                  if not isinstance(allowed_tools, str) or not allowed_tools.strip():
                      errors.append("frontmatter allowed-tools must be a non-empty space-separated string")
              return errors, body


          def validate_resource_routes(body: str, files: dict[str, bytes]) -> list[str]:
              errors: list[str] = []
              direct_links: set[str] = set()
              for raw_target in MARKDOWN_LINK_RE.findall(body):
                  target = raw_target.strip()
                  if not target or target.startswith("#") or URI_SCHEME_RE.match(target):
                      continue
                  decoded = urllib.parse.unquote(target)
                  if not RESOURCE_NAMESPACE_RE.search(decoded):
                      continue
                  if decoded != target:
                      errors.append(f"encoded resource route is not allowed: {target}")
                      continue
                  if not SAFE_RESOURCE_LINK_RE.fullmatch(target):
                      errors.append(f"unsafe or non-portable resource route: {target}")
                      continue
                  direct_links.add(target)
                  if target not in files:
                      errors.append(f"routed resource is not packaged: {target}")
              packaged_routes = {
                  rel for rel in files
                  if (rel.startswith("references/") or rel.startswith("templates/")) and rel.endswith(".md")
              }
              for rel in sorted(packaged_routes - direct_links):
                  errors.append(f"packaged resource is not directly Markdown-linked from SKILL.md: {rel}")
              return errors


          '''
          text = text[:start] + replacement + text[end:]
          route_start = text.index("    mentions = set(RESOURCE_MENTION_RE.findall(body))")
          route_end = text.index("    for rel in sorted(packaged_routes):", route_start)
          route_replacement = '''    errors.extend(validate_resource_routes(body, files))
              packaged_routes = {
                  rel for rel in files
                  if (rel.startswith("references/") or rel.startswith("templates/")) and rel.endswith(".md")
              }
          '''
          text = text[:route_start] + route_replacement + text[route_end:]
          validator.write_text(text, encoding="utf-8")

          Path("source/requirements-validation.txt").write_text("PyYAML==6.0.2\n", encoding="utf-8")

          for readme_name in ("README.md", "source/README.md"):
              readme = Path(readme_name)
              body = readme.read_text(encoding="utf-8")
              command = "python -m unittest discover -s tests -v"
              install_command = "python -m pip install -r source/requirements-validation.txt"
              if install_command not in body:
                  body = body.replace(command, install_command + "\n" + command, 1)
              readme.write_text(body, encoding="utf-8")

          active = Path("workplans/active/PROTOCOL-5.8-EFFECTIVE-COMPRESSION.md")
          archived = Path("workplans/archive/PROTOCOL-5.8-EFFECTIVE-COMPRESSION.md")
          plan = active.read_text(encoding="utf-8")
          plan = plan.replace("status: active\ncreated_date: 2026-08-26", "status: completed\ncompleted_date: 2026-08-29\ncreated_date: 2026-08-26", 1)
          archived.write_text(plan, encoding="utf-8")
          active.unlink()

          Path("tests/test_protocol_59_review_rework.py").write_text(r'''from __future__ import annotations

          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = ROOT / "source"
          sys.path.insert(0, str(SOURCE))

          import validate_packages  # noqa: E402


          class FrontmatterSchemaTests(unittest.TestCase):
              def validate(self, frontmatter: str):
                  text = f"---\n{frontmatter}\n---\nbody\n"
                  return validate_packages.validate_frontmatter(text, "sample-skill")[0]

              def test_valid_nested_metadata_and_allowed_tools(self) -> None:
                  errors = self.validate('name: sample-skill\ndescription: Portable sample.\ncompatibility: Requires git.\nmetadata:\n  owner: test\n  version: "1"\nallowed-tools: Bash(git:*) Read')
                  self.assertEqual([], errors)

              def test_malformed_yaml_is_rejected(self) -> None:
                  errors = self.validate('name: sample-skill\ndescription: Sample.\nmetadata: [unterminated')
                  self.assertTrue(any("invalid YAML" in error for error in errors), errors)

              def test_compatibility_type_and_length_are_rejected(self) -> None:
                  errors = self.validate('name: sample-skill\ndescription: Sample.\ncompatibility: [linux]')
                  self.assertTrue(any("compatibility must be" in error for error in errors), errors)
                  errors = self.validate('name: sample-skill\ndescription: Sample.\ncompatibility: "' + ('x' * 501) + '"')
                  self.assertTrue(any("exceeds 500" in error for error in errors), errors)

              def test_metadata_requires_string_keys_and_values(self) -> None:
                  errors = self.validate('name: sample-skill\ndescription: Sample.\nmetadata:\n  owner: [team]')
                  self.assertTrue(any("metadata keys and values" in error for error in errors), errors)
                  errors = self.validate('name: sample-skill\ndescription: Sample.\nmetadata:\n  7: seven')
                  self.assertTrue(any("metadata keys and values" in error for error in errors), errors)

              def test_allowed_tools_must_be_scalar_string(self) -> None:
                  errors = self.validate('name: sample-skill\ndescription: Sample.\nallowed-tools:\n  - Read')
                  self.assertTrue(any("allowed-tools must be" in error for error in errors), errors)


          class ResourceRouteSafetyTests(unittest.TestCase):
              def assert_unsafe(self, target: str) -> None:
                  errors = validate_packages.validate_resource_routes(f"Read [resource]({target}).", {})
                  self.assertTrue(any("unsafe or non-portable" in error for error in errors), errors)

              def test_parent_traversal_from_reference_namespace_is_rejected(self) -> None:
                  self.assert_unsafe("references/../outside.md")

              def test_parent_traversal_into_reference_namespace_is_rejected(self) -> None:
                  self.assert_unsafe("../references/outside.md")

              def test_backslash_resource_path_is_rejected(self) -> None:
                  self.assert_unsafe(r"references\outside.md")

              def test_safe_but_missing_resource_still_fails(self) -> None:
                  errors = validate_packages.validate_resource_routes("Read [resource](references/missing.md).", {})
                  self.assertTrue(any("routed resource is not packaged" in error for error in errors), errors)


          class WorkplanLifecycleTests(unittest.TestCase):
              def test_protocol_58_workplan_is_archived_completed(self) -> None:
                  active = ROOT / "workplans/active/PROTOCOL-5.8-EFFECTIVE-COMPRESSION.md"
                  archived = ROOT / "workplans/archive/PROTOCOL-5.8-EFFECTIVE-COMPRESSION.md"
                  self.assertFalse(active.exists())
                  self.assertTrue(archived.is_file())
                  text = archived.read_text(encoding="utf-8")
                  self.assertIn("status: completed", text)
                  self.assertIn("completed_date: 2026-08-29", text)
                  active_names = {path.name for path in (ROOT / "workplans/active").glob("*.md")}
                  self.assertTrue(active_names)
                  self.assertTrue(all(name.startswith("PROTOCOL-5.9-") for name in active_names), active_names)


          if __name__ == "__main__":
              unittest.main()
          '''.replace("\n          ", "\n"), encoding="utf-8")
          PY
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run complete protocol regression suite
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated packages
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested non-workflow changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md source workplans tests
          git commit -m "Fix Protocol 5.9 review blockers"
          git push origin HEAD:protocol-5.9-agent-portable-routing-finalize

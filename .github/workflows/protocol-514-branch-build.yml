name: Protocol 5.14 branch build

on:
  push:
    branches:
      - plan/protocol-5.14-solution-boundary-simplicity

permissions:
  contents: write

jobs:
  validate-and-regenerate:
    if: ${{ !contains(github.event.head_commit.message, '[skip p514-build]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.14-solution-boundary-simplicity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical distribution
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated packages
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Replace committed distribution
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Verify distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check whitespace
        run: git diff --check
      - name: Commit regenerated distribution
        run: |
          if git diff --quiet -- dist; then
            echo "Distribution already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Regenerate Protocol 5.14 distribution [skip p514-build]"
          git push origin HEAD:plan/protocol-5.14-solution-boundary-simplicity

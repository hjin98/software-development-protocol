name: Protocol 5.4 Finalize Packages

on:
  push:
    branches:
      - feat/protocol-5.4-development-economy

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/protocol-5.4-development-economy
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run final protocol regression suite
        run: python -m unittest discover -s tests -v
      - name: Build canonical packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated packages
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Publish exact tested distribution
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          git diff --check
      - name: Commit tested distribution and remove temporary publisher
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git rm .github/workflows/protocol-54-finalize.yml
          git diff --cached --check
          git commit -m "Regenerate Protocol 5.4 distributions after closure review"
          git push origin "HEAD:${GITHUB_REF_NAME}"

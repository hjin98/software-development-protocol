name: Protocol G9 Publish Dist

on:
  push:
    branches:
      - feat/protocol-5.4-development-economy

permissions:
  contents: write

jobs:
  publish-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Stage exact canonical distribution
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Verify source-to-dist semantic parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit tested distribution
        run: |
          git add dist
          if git diff --cached --quiet; then
            echo "Distribution already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "G9 regenerate Protocol 5.4 distributions"
          git push origin "HEAD:${GITHUB_REF_NAME}"

name: Temporary Protocol 5.13 oracle implementation v2

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.13-tool-routing-codeql-compression
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r source/requirements-validation.txt
      - run: python tmp_protocol_513_patch.py
      - name: Focused oracle family
        run: python -m unittest tests.test_protocol_511_tool_assistance tests.test_protocol_513_counterfactual_oracles tests.test_protocol_513_oracle_family_closure -v
      - name: Full regression
        run: python -m unittest discover -s tests -v
      - run: python source/build_skills.py --output /tmp/protocol-dist
      - run: python source/validate_packages.py --dist /tmp/protocol-dist
      - run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - run: git diff --check
      - name: Commit clean candidate
        run: |
          rm .github/workflows/tmp-implement-protocol-513-oracle.yml
          rm .github/workflows/tmp-implement-protocol-513-oracle-v2.yml
          rm tmp_protocol_513_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_protocol_513_oracle_family_closure.py .github/workflows/tmp-implement-protocol-513-oracle.yml .github/workflows/tmp-implement-protocol-513-oracle-v2.yml tmp_protocol_513_patch.py
          git diff --cached --check
          git commit -m 'test: close Protocol 5.13 distributed oracle family'
          git push origin HEAD:plan/protocol-5.13-tool-routing-codeql-compression

name: Protocol 5.8 dist sync

on:
  push:
    branches:
      - protocol-5.8-effective-compression
    paths:
      - source/**
      - .github/workflows/protocol-5.8-dist-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: protocol-5.8-effective-compression
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and validate canonical packages
        run: |
          python source/build_skills.py --output dist
          python source/validate_packages.py --dist dist
      - name: Commit generated distribution when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate Protocol 5.8 distributions"
          git push origin HEAD:protocol-5.8-effective-compression

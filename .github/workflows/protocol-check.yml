name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main
      - feat/protocol-5.1-documentation-specialist

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build canonical skills
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Inspect generated packages
        run: |
          python - <<'PY'
          import json, zipfile
          from pathlib import Path
          root=Path('/tmp/protocol-dist')
          index=json.loads((root/'BUILD_INDEX.json').read_text())
          assert index['protocol_version']=='5.1.0'
          assert index['lifecycle_roles']==['software-design','software-implementation']
          assert index['specialists']==['software-documentation']
          for name in index['skills']:
              p=root/f'{name}.zip'
              assert p.is_file() and p.stat().st_size > 0
              with zipfile.ZipFile(p) as zf:
                  names=set(zf.namelist())
                  assert f'{name}/SKILL.md' in names
                  assert f'{name}/PROTOCOL_VERSION' in names
          print(index)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: protocol-5.1-dist
          path: /tmp/protocol-dist
          if-no-files-found: error

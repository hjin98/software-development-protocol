name: Protocol build check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate canonical skill build
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py

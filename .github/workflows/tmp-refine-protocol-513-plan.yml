          text = text.replace(old, new, 1)

          old = '''At minimum, source-linked route mutations must reject a Serena/Semgrep target swap, Hypothesis target substitution, CodeQL flow routed to ordinary or merely structural handling, and ordinary literal/local work forced into a specialist. Prefer replacing the linked target or route meaning in a copied actual dispatch row/line so the mutation is inside the same semantic unit the predicate claims to govern.'''
          new = '''At minimum, source-linked route mutations must reject a Serena/Semgrep target swap, Hypothesis target substitution, CodeQL flow routed to ordinary or merely structural handling, and ordinary literal/local work forced into a specialist. Each specialized dispatch row must resolve to **exactly one required specific-tool target for that class**; the ordinary row must resolve to no forced specialist. Therefore also reject additive contradictions that retain the correct target while adding another wrong `MUST read`/specialist target on the same governed row. Prefer mutating the linked target or route meaning in a copied actual dispatch row/line so the mutation is inside the same semantic unit the predicate claims to govern.'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''**Capability-discovery negative:** when a specialized class fires, availability is genuinely unknown, and a cheap non-mutating probe is practical on the host, `never probe`, silently assume absence, or default to ordinary tools without checking must fail. A capability already known unavailable need not be probed again; a host with no safe/practical cheap probe, or disproportionate setup for a trivially bounded claim, may take an already-permitted concrete fallback.'''
          new = '''**Capability-discovery negative:** when a specialized class fires, availability is genuinely unknown, and a cheap non-mutating probe is practical on the host, `never probe`, silently assume absence, or default to ordinary tools without checking must fail. The inverse overconstraint must also fail: do not require probing when availability is already known, when the host exposes no safe/practical cheap probe, or when already-permitted disproportionate setup for a trivially bounded claim makes concrete fallback appropriate. Test both directions against copied actual lifecycle policy units so the conditional is preserved rather than collapsed into either "never probe" or "always probe."'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''**Disposition/fallback negative:** built-in familiarity/default preference is not a permitted reason to skip an available/current/supported capability that directly models the claim. Concrete fallbacks such as unsupported language/backend, unavailable tool surface, irrecoverably stale state, model mismatch, disproportionate setup for a trivial bounded claim, or already-available equally reliable cheaper evidence remain valid.'''
          new = '''**Disposition/fallback negative:** built-in familiarity/default preference is not a permitted reason to skip an available/current/supported capability that directly models the claim. More generally, retaining the positive presumptive-use rule while adding that such a directly matching capability may be skipped **without a concrete permitted reason** must fail; the oracle may not protect only the familiarity wording. Concrete fallbacks such as unsupported language/backend, unavailable tool surface, irrecoverably stale state, model mismatch, disproportionate setup for a trivial bounded claim, or already-available equally reliable cheaper evidence remain valid.'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''**Model-limit negative:** an explicit policy that treats specialist output as exhaustive despite a plausible dynamic/generated/runtime/configuration/external-consumer blind spot must fail. Cross-checking remains proportionate: no duplicate analyzer/search pass is required when no material blind spot exists.'''
          new = '''**Model-limit negative:** an explicit policy that treats specialist output as exhaustive despite a plausible dynamic/generated/runtime/configuration/external-consumer blind spot must fail. The inverse overconstraint must also fail: the policy may not require a duplicate analyzer/search pass when no material blind spot exists. Protect both sides of the conditional with source-linked mutations; cross-checking is required when a material model blind spot can hide the claim and remains unnecessary ceremony when it cannot.'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''**Overlap/non-ceremony negative:** broad topic rules such as `security always means CodeQL`, structural-security routed away from Semgrep solely because it is security, and any fixed mandatory multi-tool pipeline must fail. Multi-relation claims may decompose and use the minimum capability set needed.

### Already-accepted CodeQL/provenance/compression counterfactuals'''
          new = '''**Overlap/non-ceremony negative:** broad topic rules such as `security always means CodeQL`, structural-security routed away from Semgrep solely because it is security, and any fixed mandatory multi-tool pipeline must fail. Include an explicit source-linked structural-security inversion (for example, retaining the valid forbidden-call/structural rule while adding that the same forbidden-call relation must use CodeQL solely because it is security). Multi-relation claims may decompose and use the minimum capability set needed.

**Tool-specific owner liveness:** because selection boundaries, capability/model limitations, and tool-specific fallbacks are canonically owned by `tool-serena.md`, `tool-semgrep.md`, `tool-hypothesis.md`, and `tool-codeql.md`, a whole-file positive phrase census is insufficient. For **each of the four tool-specific owners**, the governing predicate must accept the actual current owner and reject at least one representative material contradiction inserted into a copied actual selection/capability/fallback policy unit. Use a tool-appropriate inversion—for example, forcing Serena onto literal/unsupported surfaces, allowing Semgrep to substitute for an interprocedural claim, forcing Hypothesis onto a small already-exhaustive deterministic case or permitting arbitrary skip of a triggered broad-state case, or forcing CodeQL onto a purely structural/security-by-topic claim. Equivalent stronger inversions are delegated. The composed routing-chain oracle must also fail when any one distributed owner is so inverted while all other owners remain valid.

This per-owner mutation requirement does **not** require duplicating detailed specialist mechanics into lifecycle/common owners and does not require one mutation for every sentence in a tool file. It closes the finite canonical-owner boundary of the routing-chain family.

### Already-accepted CodeQL/provenance/compression counterfactuals'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''- replacing correct relation-to-target checking with global filename presence;
- re-expanding lifecycle/common/convergence prose merely to satisfy an exact-phrase test;'''
          new = '''- replacing correct relation-to-target checking with global filename presence;
- accepting a row merely because the correct target remains present while a second wrong required specialist is added;
- accepting a current valid policy merely because its positive phrase remains present after an in-unit contradictory clause is added;
- treating tool-specific owner presence checks as liveness without a canonical-source contradiction mutation;
- re-expanding lifecycle/common/convergence prose merely to satisfy an exact-phrase test;'''
          assert old in text
          text = text.replace(old, new, 1)

          old = '''3. all five relation-class associations, direct entry/no mandatory second hop, practical unknown-availability probing, presumptive-use/permitted-fallback polarity, conditional model-limit cross-check, overlap, and non-ceremony;

          new = '''The bounded family is considered genuinely closed only when the current canonical owners pass, the finite inversion/boundary basis above passes, representative **additive in-unit contradictions** fail, each distributed owner class is mutation-live, the focused family command passes before the full chain, and the exact assembled candidate passes final acceptance. A later material failure in this same acceptance-oracle family becomes eligible for genuine post-family Design reconsideration only after that closure has actually been achieved and explicitly claimed. Until then, another miss is incomplete implementation family closure under this unchanged design.'''

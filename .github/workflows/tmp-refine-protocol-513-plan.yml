          new = '''3. all five relation-class associations with unique per-row target ownership, direct entry/no mandatory second hop, practical unknown-availability probing **and its legitimate no-probe boundary**, presumptive-use/permitted-fallback polarity including arbitrary-skip rejection, conditional model-limit cross-check **and its no-blind-spot boundary**, structural-security overlap, non-ceremony, and canonical-source contradiction liveness for each Serena/Semgrep/Hypothesis/CodeQL specific owner;

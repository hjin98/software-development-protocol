    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.13-tool-routing-codeql-compression
      - name: Refine current oracle-family authority
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('workplans/active/PROTOCOL-5.13-TOOL-ROUTING-CODEQL-COMPRESSION.md')
          text = path.read_text(encoding='utf-8')

          old = '''A detached toy-string mutation is insufficient if the same predicate never demonstrates that a material mutation of its actual source owner fails. Likewise, appending a contradiction outside a deliberately sliced paragraph/section does not establish liveness.

Use bounded line/row/paragraph/section extraction or an equivalent deterministic matcher. No general natural-language theorem prover, mutation-testing framework, semantic linter, policy DSL, or persistent routing ledger is required.'''
          new = '''A detached toy-string mutation is insufficient if the same predicate never demonstrates that a material mutation of its actual source owner fails. Likewise, appending a contradiction outside a deliberately sliced paragraph/section does not establish liveness.

For the representative inversion basis below, apply a **monotonic contradiction counterfactual**: if the current governed source unit passes, retaining that valid wording while adding a materially conflicting clause **inside the same governed unit** must make the same predicate fail. A predicate is not live merely because it detects replacement/removal of the positive wording. Unrelated compatible additions must remain acceptable; this is bounded polarity protection, not a rule that any extra prose fails.

Use bounded line/row/paragraph/section extraction or an equivalent deterministic matcher. No general natural-language theorem prover, mutation-testing framework, semantic linter, policy DSL, or persistent routing ledger is required.'''

name: Temporary Protocol 5.13 oracle parser fix

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.13-tool-routing-codeql-compression
      - name: Normalize governed policy paragraphs
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_protocol_513_oracle_family_closure.py')
          text = path.read_text(encoding='utf-8')
          old = '    paragraph = paragraph_containing(text, needle).lower()\n'
          new = '    paragraph = norm(paragraph_containing(text, needle))\n'
          if old not in text:
              raise SystemExit('expected parser line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tests/test_protocol_513_oracle_family_closure.py
          git rm .github/workflows/tmp-fix-oracle-parser.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_protocol_513_oracle_family_closure.py
          git commit -m 'test: normalize Protocol 5.13 oracle policy units'
          git push

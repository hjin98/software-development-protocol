name: Protocol 5.9 URI route rework

on:
  push:
    branches:
      - protocol-5.9-agent-portable-routing-finalize
    paths:
      - .github/workflows/protocol-5.9-uri-route-rework.yml

permissions:
  contents: write

jobs:
  rework:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: protocol-5.9-agent-portable-routing-finalize
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply bounded URI route fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator = Path("source/validate_packages.py")
          text = validator.read_text(encoding="utf-8")
          old_constants = 'URI_SCHEME_RE = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")\nSTANDARD_FRONTMATTER_KEYS = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}\n'
          new_constants = 'URI_SCHEME_RE = re.compile(r"^[A-Za-z][A-Za-z0-9+.-]*:")\nWINDOWS_ABSOLUTE_RE = re.compile(r"^[A-Za-z]:[\\\\/]")\nSTANDARD_FRONTMATTER_KEYS = {"name", "description", "license", "compatibility", "metadata", "allowed-tools"}\n'
          if text.count(old_constants) != 1:
              raise SystemExit("validator constants block changed unexpectedly")
          text = text.replace(old_constants, new_constants)

          old_route = '''        target = raw_target.strip()
                  if not target or target.startswith("#") or URI_SCHEME_RE.match(target):
                      continue
                  decoded = urllib.parse.unquote(target)
                  if not RESOURCE_NAMESPACE_RE.search(decoded):
                      continue
                  if decoded != target:
                      errors.append(f"encoded resource route is not allowed: {target}")
                      continue
          '''
          new_route = '''        target = raw_target.strip()
                  if not target or target.startswith("#"):
                      continue
                  decoded = urllib.parse.unquote(target)
                  if not RESOURCE_NAMESPACE_RE.search(decoded):
                      continue
                  if WINDOWS_ABSOLUTE_RE.match(decoded) or decoded.lower().startswith("file:"):
                      errors.append(f"unsafe or non-portable resource route: {target}")
                      continue
                  if URI_SCHEME_RE.match(decoded):
                      continue
                  if decoded != target:
                      errors.append(f"encoded resource route is not allowed: {target}")
                      continue
          '''
          old_route = old_route.replace("          ", "")
          new_route = new_route.replace("          ", "")
          if text.count(old_route) != 1:
              raise SystemExit("validator resource-route block changed unexpectedly")
          validator.write_text(text.replace(old_route, new_route), encoding="utf-8")

          test = Path("tests/test_protocol_59_route_uri_safety.py")
          test.write_text(r'''from __future__ import annotations

          import sys
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          SOURCE = ROOT / "source"
          sys.path.insert(0, str(SOURCE))

          import validate_packages  # noqa: E402


          class ResourceRouteUriSafetyTests(unittest.TestCase):
              def assert_unsafe(self, target: str) -> None:
                  errors = validate_packages.validate_resource_routes(f"Read [resource]({target}).", {})
                  self.assertTrue(any("unsafe or non-portable" in error for error in errors), errors)

              def test_windows_backslash_absolute_resource_path_is_rejected(self) -> None:
                  self.assert_unsafe(r"C:\references\outside.md")

              def test_windows_forward_slash_absolute_resource_path_is_rejected(self) -> None:
                  self.assert_unsafe("C:/references/outside.md")

              def test_file_uri_resource_path_is_rejected(self) -> None:
                  self.assert_unsafe("file:///tmp/references/outside.md")

              def test_external_https_resource_like_path_is_not_treated_as_local_bundle_route(self) -> None:
                  errors = validate_packages.validate_resource_routes(
                      "Read [external](https://example.com/references/guide.md).", {}
                  )
                  self.assertEqual([], errors)


          if __name__ == "__main__":
              unittest.main()
          '''.replace("          ", ""), encoding="utf-8")

          plan = Path("workplans/active/PROTOCOL-5.9-AGENT-PORTABLE-SKILL-ROUTING-URI-ROUTE-REWORK.md")
          plan.write_text(r'''---
          kind: implementation-workplan-amendment
          workplan_id: PROTOCOL-5.9-AGENT-PORTABLE-SKILL-ROUTING-URI-ROUTE-REWORK
          amends_workplan_id: PROTOCOL-5.9-AGENT-PORTABLE-SKILL-ROUTING
          protocol_version: 5.8.0
          target_protocol_version: 5.9.0
          status: active
          created_date: 2026-08-29
          review_source: independent-software-design-review-round-2
          ---

          # Protocol 5.9 Routing Workplan — URI/Absolute Route Rework Amendment

          This amendment closes the remaining blocking implementation nonconformance found during the second independent Software Design review of the Protocol 5.9 candidate. It does not reopen the accepted routing/distribution architecture, the doctrine/content freeze, or the already completed R1-R3 rework. The governing hierarchy remains exactly:

          ```text
          product engineering fitness > minimum justified product/system complexity > development economy
          ```

          All Protocol 5.4-5.8 hardening remains frozen. Rework is limited to local-resource route classification in the package validator and regression evidence for that classification.

          ## R4 — Classify local resource routes before generic URI skipping

          ### Concern

          `source/validate_packages.py` currently checks `URI_SCHEME_RE` before determining whether a Markdown target is attempting to address the packaged `references` or `templates` namespace. Windows absolute paths such as `C:\references\outside.md` and `C:/references/outside.md` therefore match the drive-letter prefix as a URI scheme and can be silently ignored. `file:` resource URIs are similarly skipped. This violates R2's requirement that absolute/backslash/local-resource escape forms be rejected rather than omitted from validation.

          ### Required end state

          `validate_resource_routes()` must first determine whether a decoded Markdown link target attempts to address the local packaged `references` or `templates` namespace, then classify that target correctly:

          - Windows drive-absolute forms using either slash direction are local/absolute resource routes and must fail validation;
          - `file:` URIs that address the packaged resource namespace must fail validation;
          - ordinary external URI schemes such as `https:` remain external links and must not be misclassified as local package routes merely because their remote path contains a `references` or `templates` segment;
          - encoded, traversal, backslash-relative, deeper, query/fragment-decorated, missing, and packaged-but-unlinked cases retain the existing R2 behavior;
          - the strict supported local form remains exactly one-level `references/<safe-name>.md` or `templates/<safe-name>.md`.

          The fix belongs in the validator's owning route-classification mechanism. Do not add a second validator, wrapper, or CI-only exception.

          ### Acceptance evidence

          Add focused regression cases that would fail the reviewed candidate:

          ```text
          C:\references\outside.md
          C:/references/outside.md
          file:///tmp/references/outside.md
          ```

          Also include a positive control showing that a normal external HTTPS link whose remote path contains `/references/` is ignored as external rather than falsely rejected as a local bundle route.

          ## Required final acceptance

          After R4 is implemented:

          1. run the focused URI/absolute-route regression cases against the real `validate_resource_routes()` implementation;
          2. run the complete unit/regression suite;
          3. build all canonical skill bundles;
          4. independently validate all generated directory and ZIP bundles;
          5. verify committed `dist` parity against the fresh build;
          6. run `git diff --check`;
          7. independently re-check that no lifecycle/specialist doctrine or Protocol 5.4-5.8 semantic safeguard changed;
          8. keep live external harness qualification explicitly unqualified unless actually executed.

          The expected outcome remains the same Protocol 5.9 design and semantics, with the final known false-green in static local-resource routing validation removed.
          '''.replace("          ", ""), encoding="utf-8")
          PY
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run focused URI route regression
        run: python -m unittest discover -s tests -p 'test_protocol_59_route_uri_safety.py' -v
      - name: Run complete protocol regression suite
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated packages
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distribution parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Verify doctrine surfaces unchanged
        run: git diff --quiet HEAD -- source/roles source/specialists source/shared/references
      - name: Check whitespace
        run: git diff --check
      - name: Commit tested rework and remove runner
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/protocol-5.9-uri-route-rework.yml
          git add source/validate_packages.py tests/test_protocol_59_route_uri_safety.py workplans/active/PROTOCOL-5.9-AGENT-PORTABLE-SKILL-ROUTING-URI-ROUTE-REWORK.md
          git diff --cached --check
          git commit -m "Close Protocol 5.9 URI route validation gap"
          git push origin HEAD:protocol-5.9-agent-portable-routing-finalize

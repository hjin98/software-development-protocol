name: Apply Protocol 5.6 gated implementation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'protocol-5.6-proxy-proof-acceptance' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply canonical Protocol 5.6 transformation
        run: python .github/apply_protocol56.py
      - name: G0-G3 focused and affected protocol regression
        run: python -m unittest discover -s tests -v
      - name: Build canonical candidate packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate candidate packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Materialize committed distribution from validated candidate
        run: |
          rm -rf dist
          cp -a /tmp/protocol-dist dist
      - name: Verify source-to-dist parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit tested implementation and remove temporary automation
        run: |
          rm .github/apply_protocol56.py .github/workflows/apply-protocol56.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "implement Protocol 5.6 proxy-proof acceptance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

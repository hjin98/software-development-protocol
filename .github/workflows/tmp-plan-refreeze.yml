name: Temporary Protocol 5.13 plan refreeze

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: write

jobs:
  refreeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.13-tool-routing-codeql-compression
      - name: Patch canonical workplan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          plan = Path('workplans/active/PROTOCOL-5.13-TOOL-ROUTING-CODEQL-COMPRESSION.md')
          appendix = Path('workplans/active/.tmp-protocol-513-refreeze-appendix.md')
          text = plan.read_text(encoding='utf-8')
          text = text.replace('status: active', 'status: frozen', 1)
          if 'refrozen_again_date:' not in text.split('---', 2)[1]:
              text = text.replace('reopened_again_date: 2026-09-03\n', 'reopened_again_date: 2026-09-03\nrefrozen_again_date: 2026-09-03\n', 1)
          marker = '## Software Design plan re-review closure II — 2026-09-03'
          if marker not in text:
              text = text.rstrip() + '\n\n' + appendix.read_text(encoding='utf-8').strip() + '\n'
          plan.write_text(text, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workplans/active/PROTOCOL-5.13-TOOL-ROUTING-CODEQL-COMPRESSION.md
          git commit -m 'plan: refreeze Protocol 5.13 oracle handoff'
          git push origin HEAD:plan/protocol-5.13-tool-routing-codeql-compression

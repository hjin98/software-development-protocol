name: Protocol 5.12 branch implementation

on:
  push:
    branches:
      - plan/protocol-5.12-convergent-development

permissions:
  contents: write

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.12-convergent-development
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply idempotent Protocol 5.12 source patch
        run: python tools/apply_protocol_512.py
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Synchronize committed distribution only when semantically stale
        shell: bash
        run: |
          if ! python source/check_dist.py --expected /tmp/protocol-dist --committed dist; then
            rm -rf dist
            cp -a /tmp/protocol-dist dist
          fi
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit validated Protocol 5.12 candidate
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md source tests dist
          if git diff --cached --quiet; then
            echo "Protocol 5.12 candidate already materialized and validated"
            exit 0
          fi
          git commit -m "protocol: implement 5.12 convergent development"
          git push origin HEAD:plan/protocol-5.12-convergent-development

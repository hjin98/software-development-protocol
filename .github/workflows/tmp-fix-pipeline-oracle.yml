name: Temporary Protocol 5.13 pipeline oracle fix

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.13-tool-routing-codeql-compression
      - name: Strengthen pipeline polarity predicate and clean diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_protocol_513_oracle_family_closure.py')
          text = path.read_text(encoding='utf-8')
          old = '''def negative_subject_policy_holds(text: str, subject: str) -> bool:\n    clauses = [\n        clause\n        for clause in policy_clauses_in_paragraph(text, subject)\n        if subject.lower() in clause\n    ]\n    return bool(clauses) and all(\n        negative_subject_clause_holds(clause, subject) for clause in clauses\n    )\n'''
          new = '''def negative_subject_policy_holds(text: str, subject: str) -> bool:\n    paragraph = norm(paragraph_containing(text, subject))\n    explicit_affirmative = (\n        f"this is a {subject}",\n        f"a {subject} is required",\n        f"form a {subject}",\n        f"forms a {subject}",\n        f"must use a {subject}",\n    )\n    if any(marker in paragraph for marker in explicit_affirmative):\n        return False\n    clauses = [\n        clause\n        for clause in policy_clauses_in_paragraph(text, subject)\n        if subject.lower() in clause\n    ]\n    return bool(clauses) and all(\n        negative_subject_clause_holds(clause, subject) for clause in clauses\n    )\n'''
          if old not in text:
              raise SystemExit('pipeline predicate block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile tests/test_protocol_513_oracle_family_closure.py
          rm -f tmp-oracle-failure.txt
          git rm .github/workflows/tmp-fix-pipeline-oracle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: strengthen Protocol 5.13 pipeline polarity oracle'
          git push

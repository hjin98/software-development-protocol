name: Rebuild Protocol 5.3 distribution

on:
  push:
    branches:
      - feat/protocol-5.3-product-simplicity-testing

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/protocol-5.3-product-simplicity-testing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild tracked distributions
        run: python source/build_skills.py --output dist
      - name: Verify semantic distribution parity
        run: python source/check_dist.py
      - name: Remove one-shot workflow and commit generated packages
        run: |
          rm .github/workflows/rebuild-protocol-53.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist .github/workflows/rebuild-protocol-53.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate Protocol 5.3 skill distributions"
          git push origin HEAD:feat/protocol-5.3-product-simplicity-testing

name: Validate hardened protocol v3

on:
  push:
    branches:
      - agent/protocol-v3-role-split

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/protocol-v3-role-split
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semantic invariants
        run: python source/check_protocol_semantics.py
      - name: Synthetic lifecycle cases
        run: python source/check_protocol_lifecycle_cases.py
      - name: Canonical/generated parity
        run: python source/build_skills.py --output dist --check
      - name: Remove one-shot workflow and record successful validation
        run: |
          rm .github/workflows/validate-v3-hardened.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Validate hardened protocol v3 lifecycle"
          git push origin HEAD:agent/protocol-v3-role-split

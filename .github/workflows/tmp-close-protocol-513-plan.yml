name: Temporary close Protocol 5.13 workplan

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: write

jobs:
  close:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.13-tool-routing-codeql-compression
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python -m pip install -r source/requirements-validation.txt
      - name: Archive completed workplan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path('workplans/active/PROTOCOL-5.13-TOOL-ROUTING-CODEQL-COMPRESSION.md')
          text = src.read_text(encoding='utf-8')
          assert '\nstatus: frozen\n' in text
          text = text.replace('\nstatus: frozen\n', '\nstatus: completed\ncompleted_date: 2026-09-03\n', 1)
          dst = Path('workplans/archive/PROTOCOL-5.13-TOOL-ROUTING-CODEQL-COMPRESSION.md')
          dst.write_text(text, encoding='utf-8')
          src.unlink()
          PY
          rm .github/workflows/tmp-close-protocol-513-plan.yml
      - name: Validate closed tree
        shell: bash
        run: |
          python -m unittest discover -s tests -v
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          git diff --check
      - name: Commit closure
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'plan: complete Protocol 5.13'
          git push origin HEAD:plan/protocol-5.13-tool-routing-codeql-compression

name: Temporary build protocol dist

on:
  pull_request:
  push:
    branches:
      - feat/protocol-3.1-resource-bounded-qualification

permissions:
  contents: read

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build canonical distribution
        run: python source/build_skills.py --output dist
      - name: Upload canonical distribution
        uses: actions/upload-artifact@v4
        with:
          name: protocol-3.1-dist
          path: dist/
          if-no-files-found: error

name: Temporary build and commit protocol dist

on:
  push:
    branches:
      - feat/protocol-3.1-resource-bounded-qualification

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/protocol-3.1-resource-bounded-qualification
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build canonical distribution
        run: python source/build_skills.py --output dist
      - name: Commit generated distribution and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-build-dist.yml
          git add dist
          git commit -m "Regenerate Protocol 3.1 skill distribution"
          git push origin HEAD:feat/protocol-3.1-resource-bounded-qualification

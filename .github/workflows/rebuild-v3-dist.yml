name: Rebuild protocol v3 dist

on:
  push:
    branches:
      - agent/protocol-v3-role-split

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/protocol-v3-role-split
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Finish canonical v3 maintenance patch
        run: |
          git apply source/maintenance/protocol-v3-documentation.patch
          rm source/maintenance/protocol-v3-documentation.patch
      - name: Rebuild generated skills
        run: python source/build_skills.py --output dist
      - name: Self-remove one-shot workflow and commit generated distribution
        run: |
          rm .github/workflows/rebuild-v3-dist.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Rebuild protocol v3 generated skills"
          git push origin HEAD:agent/protocol-v3-role-split

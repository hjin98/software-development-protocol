name: Temporary Protocol 5.13 plan consolidation

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: plan/protocol-5.13-tool-routing-codeql-compression
      - name: Consolidate canonical workplan
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          plan = Path('workplans/active/PROTOCOL-5.13-TOOL-ROUTING-CODEQL-COMPRESSION.md')
          appendix = Path('workplans/active/.tmp-protocol-513-current-rework.md')
          text = plan.read_text(encoding='utf-8')
          marker = '## Independent Software Design review reopen — 2026-09-03'
          if marker not in text:
              raise SystemExit('expected review-history marker not found')
          prefix = text.split(marker, 1)[0].rstrip()
          consolidated = appendix.read_text(encoding='utf-8').strip()
          plan.write_text(prefix + '\n\n' + consolidated + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workplans/active/PROTOCOL-5.13-TOOL-ROUTING-CODEQL-COMPRESSION.md
          git commit -m 'plan: consolidate Protocol 5.13 refrozen rework authority'
          git push origin HEAD:plan/protocol-5.13-tool-routing-codeql-compression

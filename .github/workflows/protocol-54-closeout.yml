name: Protocol 5.4 Archive and Merge Closeout

on:
  push:
    branches:
      - feat/protocol-5.4-development-economy

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/protocol-5.4-development-economy
          fetch-depth: 0
      - name: Archive accepted workplan
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('workplans/active/PROTOCOL-5.4-DEVELOPMENT-ECONOMY.md')
          dst = Path('workplans/archive/PROTOCOL-5.4-DEVELOPMENT-ECONOMY.md')
          text = src.read_text(encoding='utf-8')
          text = text.replace(
              'status: active\n---',
              'status: accepted\nclosed_at: 2026-08-24\n---',
              1,
          )
          text = text.replace(
              '**Active for implementation.**',
              '**Accepted and archived after implementation, gated validation, and independent closure review.**',
              1,
          )
          text = text.replace(
              'This workplan is governed by Protocol 5.3.0 and targets Protocol 5.4.0. Protocol 5.4.0 does not exist as an accepted protocol contract until this workplan is implemented, validated, independently reviewed as warranted, and the resulting protocol revision is accepted.',
              'This workplan was governed by Protocol 5.3.0 and targeted Protocol 5.4.0. Protocol 5.4.0 was implemented, gated-validated, independently closure-reviewed, and accepted for integration into `main` on 2026-08-24.',
              1,
          )
          if 'status: accepted' not in text:
              raise SystemExit('failed to set terminal workplan status')
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(text, encoding='utf-8')
          src.unlink()
          PY
      - name: Remove temporary closeout workflow
        run: git rm .github/workflows/protocol-54-closeout.yml
      - name: Commit archive closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workplans
          git diff --cached --check
          git commit -m "Archive accepted Protocol 5.4 workplan"
      - name: Verify closeout changed no product files
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              'workplans/active/PROTOCOL-5.4-DEVELOPMENT-ECONOMY.md',
              'workplans/archive/PROTOCOL-5.4-DEVELOPMENT-ECONOMY.md',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'a4433e396373d2ab12df0d2cad13b981515aa6b4', 'HEAD'],
              text=True,
          ).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected closeout surface: {sorted(changed)}')
          PY
      - name: Push archived feature branch
        run: git push origin "HEAD:feat/protocol-5.4-development-economy"
      - name: Merge accepted Protocol 5.4 into main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff feat/protocol-5.4-development-economy -m "Merge Protocol 5.4 development economy"
          git push origin main

name: Temporary Protocol 5.10 dist regeneration

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate canonical distributions
        run: python source/build_skills.py --output dist
      - name: Validate regenerated packages
        run: python source/validate_packages.py --dist dist
      - name: Check patch whitespace
        run: git diff --check
      - name: Commit regenerated distributions
        run: |
          if git diff --quiet -- dist; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git commit -m "Regenerate protocol distributions"
          git push

name: Protocol 5.12 diagnostic capture

on:
  push:
    branches:
      - plan/protocol-5.12-convergent-development
    paths:
      - .github/workflows/protocol-512-diagnose.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Capture full regression output
        run: |
          python -m unittest discover -s tests -v > protocol-512-diagnostic.log 2>&1 || true
          cat protocol-512-diagnostic.log
      - name: Commit diagnostic output once
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add protocol-512-diagnostic.log
          git commit -m "chore: capture Protocol 5.12 diagnostic output"
          git push

name: Close Protocol 5.7 workplan

on:
  push:
    branches:
      - protocol-5.7-engineering-stewardship

permissions:
  contents: write

jobs:
  closeout:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Archive workplan and remove temporary markers
        run: python tools/protocol_57_closeout.py

      - name: Final complete protocol regression
        run: python -m unittest discover -s tests -v

      - name: Build canonical packages
        run: |
          rm -rf /tmp/protocol-dist
          python source/build_skills.py --output /tmp/protocol-dist

      - name: Validate packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist

      - name: Verify committed dist parity
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist

      - name: Check patch whitespace
        run: git diff --check

      - name: Commit closeout and remove temporary automation
        run: |
          rm -f tools/protocol_57_closeout.py .github/workflows/protocol-57-closeout.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close Protocol 5.7 engineering stewardship workplan"
          git push origin HEAD:protocol-5.7-engineering-stewardship

name: Protocol 5.13 final check

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run complete protocol test suite
        run: python -m unittest discover -s tests -v
      - name: Build candidate distributions independently
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate independent candidate distributions
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Verify committed distributions match canonical source
        run: python source/check_dist.py --expected /tmp/protocol-dist --committed dist
      - name: Check patch whitespace
        run: git diff --check

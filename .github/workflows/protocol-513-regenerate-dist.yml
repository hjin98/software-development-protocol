name: Protocol 5.13 regenerate dist

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Regenerate committed distributions from canonical source
        run: python source/build_skills.py --output dist
      - name: Validate regenerated distributions
        run: python source/validate_packages.py --dist dist
      - name: Commit regenerated distributions
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if git diff --cached --quiet; then
            echo "Committed dist is already current."
          else
            git commit -m "build: regenerate Protocol 5.13 distributions"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

name: Protocol 5.13 stage check

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Individual module regression
        run: |
          for module in \
            tests.test_build_index_contract \
            tests.test_protocol_511_tool_assistance \
            tests.test_protocol_512_convergence \
            tests.test_protocol_512_counterfactual_closure \
            tests.test_protocol_513_tool_routing_codeql_compression \
            tests.test_protocol_513_live_tool_qualification \
            tests.test_protocol_59_review_rework \
            tests.test_protocol_59_route_uri_safety \
            tests.test_protocol_contracts \
            tests.test_protocol_effective_compression \
            tests.test_protocol_engineering_stewardship \
            tests.test_protocol_portability \
            tests.test_protocol_proxy_proof_acceptance \
            tests.test_protocol_tooling; do
            python -m unittest -v "$module"
          done
      - name: Combined explicit-module process
        continue-on-error: true
        run: |
          python -m unittest -v \
            tests.test_build_index_contract \
            tests.test_protocol_511_tool_assistance \
            tests.test_protocol_512_convergence \
            tests.test_protocol_512_counterfactual_closure \
            tests.test_protocol_513_tool_routing_codeql_compression \
            tests.test_protocol_513_live_tool_qualification \
            tests.test_protocol_59_review_rework \
            tests.test_protocol_59_route_uri_safety \
            tests.test_protocol_contracts \
            tests.test_protocol_effective_compression \
            tests.test_protocol_engineering_stewardship \
            tests.test_protocol_portability \
            tests.test_protocol_proxy_proof_acceptance \
            tests.test_protocol_tooling
      - name: Discovery with explicit top level
        continue-on-error: true
        run: python -m unittest discover -s tests -t . -v
      - name: Required repository discovery command
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Check patch whitespace
        run: git diff --check

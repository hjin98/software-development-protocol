name: Protocol 5.13 stage check

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Run focused Protocol 5.11/5.12 routing and convergence regression
        run: |
          python -m unittest -v \
            tests.test_protocol_511_tool_assistance.Protocol511ToolAssistanceTests.test_lifecycle_entrypoints_dispatch_directly_by_question_class \
            tests.test_protocol_511_tool_assistance.Protocol511ToolAssistanceTests.test_tool_references_are_packaged_only_for_lifecycle_roles \
            tests.test_protocol_511_tool_assistance.Protocol511ToolAssistanceTests.test_common_reference_owns_selection_composition_and_authority \
            tests.test_protocol_511_tool_assistance.Protocol511ToolAssistanceTests.test_common_reference_is_progressive_disclosure_not_tool_manual \
            tests.test_protocol_511_tool_assistance.Protocol511ToolAssistanceTests.test_serena_guidance_protects_backend_completeness_mutation_and_memory \
            tests.test_protocol_511_tool_assistance.Protocol511ToolAssistanceTests.test_semgrep_guidance_bounds_rule_engine_scope_and_suppressions \
            tests.test_protocol_511_tool_assistance.Protocol511ToolAssistanceTests.test_hypothesis_guidance_preserves_oracle_durability_and_isolation \
            tests.test_protocol_512_convergence \
            tests.test_protocol_512_counterfactual_closure
      - name: Run focused Protocol 5.13 routing and compression checks
        run: |
          python -m unittest -v \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_dispatch_is_per_question_relation_first_and_direct \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_trigger_requires_reference_entry_and_non_silent_disposition \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_overlap_classification_is_relation_not_security_label \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_serena_semgrep_hypothesis_keep_distinct_positive_and_negative_cases \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_codeql_is_dataflow_specialist_not_generic_security_gate \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_codeql_provenance_distinguishes_execution_from_result_hosting \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_codeql_database_identity_invalidation_and_query_governance \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_codeql_build_and_hosted_analysis_obey_trust_and_resource_rules \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_tool_common_owner_is_smaller_and_specific_methods_are_split \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_entrypoints_are_directionally_compressed_after_new_routing \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_role_critical_workflow_surface_materially_decreases \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_loaded_context_scenarios_are_progressively_disclosed \
            tests.test_protocol_513_tool_routing_codeql_compression.Protocol513ToolRoutingCodeQLCompressionTests.test_convergence_extraction_preserves_hard_trigger
      - name: Build and validate skill package structure
        run: |
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist

name: Protocol 5.13 stage check

on:
  push:
    branches:
      - plan/protocol-5.13-tool-routing-codeql-compression

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r source/requirements-validation.txt
      - name: Build index contracts
        if: always()
        run: python -m unittest -v tests.test_build_index_contract
      - name: Protocol 5.11 tool assistance
        if: always()
        run: python -m unittest -v tests.test_protocol_511_tool_assistance
      - name: Protocol 5.12 convergence
        if: always()
        run: python -m unittest -v tests.test_protocol_512_convergence
      - name: Protocol 5.12 counterfactual closure
        if: always()
        run: python -m unittest -v tests.test_protocol_512_counterfactual_closure
      - name: Protocol 5.13 routing CodeQL compression
        if: always()
        run: python -m unittest -v tests.test_protocol_513_tool_routing_codeql_compression
      - name: Protocol 5.13 live qualification
        if: always()
        run: python -m unittest -v tests.test_protocol_513_live_tool_qualification
      - name: Protocol 5.9 review rework
        if: always()
        run: python -m unittest -v tests.test_protocol_59_review_rework
      - name: Protocol 5.9 URI routing
        if: always()
        run: python -m unittest -v tests.test_protocol_59_route_uri_safety
      - name: Protocol core contracts
        if: always()
        run: python -m unittest -v tests.test_protocol_contracts
      - name: Effective compression historical contracts
        if: always()
        run: python -m unittest -v tests.test_protocol_effective_compression
      - name: Engineering stewardship contracts
        if: always()
        run: python -m unittest -v tests.test_protocol_engineering_stewardship
      - name: Portability contracts
        if: always()
        run: python -m unittest -v tests.test_protocol_portability
      - name: Proxy-proof acceptance contracts
        if: always()
        run: python -m unittest -v tests.test_protocol_proxy_proof_acceptance
      - name: Protocol tooling contracts
        if: always()
        run: python -m unittest -v tests.test_protocol_tooling
      - name: Required repository discovery command
        if: always()
        run: python -m unittest discover -s tests -v
      - name: Build canonical skill packages
        if: always()
        run: python source/build_skills.py --output /tmp/protocol-dist
      - name: Validate generated skill packages independently
        if: always()
        run: python source/validate_packages.py --dist /tmp/protocol-dist
      - name: Check patch whitespace
        if: always()
        run: git diff --check

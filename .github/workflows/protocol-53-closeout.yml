name: Protocol 5.3 closeout rebuild

on:
  push:
    branches:
      - feat/protocol-5.3-product-simplicity-testing

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run protocol regression tests
        run: python -m unittest discover -s tests -v

      - name: Build and validate final skill packages
        run: |
          python source/build_skills.py --output /tmp/protocol-dist
          python source/validate_packages.py --dist /tmp/protocol-dist
          rm -rf dist
          cp -a /tmp/protocol-dist dist
          python source/check_dist.py --expected /tmp/protocol-dist --committed dist
          git diff --check

      - name: Commit generated distribution and retire one-shot workflow
        run: |
          rm .github/workflows/protocol-53-closeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist .github/workflows/protocol-53-closeout.yml
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate final Protocol 5.3 skill distributions"
            git push
          fi
